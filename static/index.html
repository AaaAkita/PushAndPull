<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Playwright 编辑器</title>
<link rel="stylesheet" href="style.css?v=2">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="flex flex-col h-screen overflow-hidden">

<!-- Top Toolbar -->
<header class="toolbar">
    <div class="toolbar-left">
        <span class="brand-mini"><i class="fa-solid fa-layer-group"></i></span>
        <input id="flow-title" class="flow-title" value="未命名流程" title="点击编辑名称">
        <span id="save-status" class="save-status">已保存</span>
    </div>
    <div class="toolbar-center">
        <button id="run-btn-top" class="btn-apple">
            <i class="fa-solid fa-play"></i> 运行
        </button>
        <button id="stop-btn-top" class="btn btn-ghost btn-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            <i class="fa-solid fa-stop"></i> 停止
        </button>
        <button id="test-btn-top" class="btn btn-ghost btn-sm" disabled>
            <i class="fa-solid fa-vial"></i> 测试
        </button>
    </div>
    <div class="toolbar-right">
        <button class="btn btn-ghost btn-sm" onclick="handleSchemeNav()">
            <i class="fa-solid fa-folder-open"></i> 方案
        </button>
        <button id="save-btn-top" class="btn btn-ghost btn-sm">
            <i class="fa-solid fa-floppy-disk"></i> 保存
        </button>
        <button class="btn btn-ghost btn-sm hover:text-danger" onclick="clearSteps()">
            <i class="fa-solid fa-trash"></i> 清空
        </button>
        <a href="https://github.com/AnxForever/stylekit" target="_blank" class="text-sm text-tertiary hover:text-primary ml-1" title="帮助文档">
            <i class="fa-solid fa-circle-question"></i>
        </a>
    </div>
</header>

<div class="flex flex-1 overflow-hidden">

<!-- Left Sidebar: Component Lib -->
<aside class="layout-sidebar-left border-r flex flex-col px-6 py-6 bg-panel">
    <h2 class="text-xs font-semibold uppercase tracking-wider text-tertiary mb-4">组件库</h2>
    <div class="space-y-3 flex-1 overflow-y-auto">
        <button onclick="addStep('excel_read')" class="btn-component">
            <i class="fa-solid fa-table w-6 text-center"></i> Excel 读取
        </button>
        <button onclick="addStep('record_excel')" class="btn-component hidden">
            <i class="fa-solid fa-file-excel w-6 text-center"></i> 记录结果
        </button>
        <button onclick="addStep('open_url')" class="btn-component">
            <i class="fa-solid fa-link w-6 text-center"></i> 打开链接
        </button>
        <button onclick="addStep('label_input')" class="btn-component">
            <i class="fa-solid fa-tags w-6 text-center"></i> 标签输入
        </button>
        <button onclick="addStep('input_text')" class="btn-component">
            <i class="fa-solid fa-pen-to-square w-6 text-center"></i> 输入文本
        </button>
        <button onclick="addStep('upload_file')" class="btn-component">
            <i class="fa-solid fa-file-arrow-up w-6 text-center"></i> 文件上传
        </button>
        <button onclick="addStep('click')" class="btn-component">
            <i class="fa-solid fa-computer-mouse w-6 text-center"></i> 点击元素
        </button>
        <button onclick="addStep('dropdown_select')" class="btn-component">
            <i class="fa-solid fa-list-ul w-6 text-center"></i> 下拉智能选择
        </button>
        <button onclick="addStep('wait')" class="btn-component hidden">
            <i class="fa-solid fa-hourglass-start w-6 text-center"></i> 等待/检测
        </button>
        <button onclick="addStep('keyboard')" class="btn-component hidden">
            <i class="fa-solid fa-keyboard w-6 text-center"></i> 键盘模拟
        </button>
    </div>
</aside>

  <!-- Main Canvas: 内容自适应，用内边距控制呼吸感 -->
  <main class="layout-canvas bg-canvas px-10 py-6 overflow-y-auto relative flex flex-col">
      <div id="canvas-container" class="w-full fade-in">
        <!-- empty state and step cards injected by JS -->
    </div>
</main>

<!-- Right Sidebar: Properties -->
<aside class="layout-sidebar-right border-l bg-panel px-12 py-6 flex flex-col overflow-y-auto properties-panel">
    <h3>属性设置</h3>
    <div id="properties-content" class="space-y-0">
        <p class="text-tertiary text-center mt-10">请选择一个步骤以设置属性</p>
    </div>
</aside>

</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
